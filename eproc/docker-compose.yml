services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eproc_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_USER: eproc_user
      MYSQL_PASSWORD: eproc_password
      MYSQL_DATABASE: eproc_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eproc_network
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - vendor/
            - node_modules/
            - .git/

  db:
    image: mysql:8.0
    container_name: eproc_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: eproc_db
      MYSQL_USER: eproc_user
      MYSQL_PASSWORD: eproc_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./eproc_migrasi.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eproc_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  eproc_network:
    driver: bridge
