services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.ci4
    image: eproc-ci4-app:latest
    container_name: eproc_ci4_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ci4_vendor:/var/www/html/vendor
      - ci4_node_modules:/var/www/html/node_modules
    environment:
      CI_ENVIRONMENT: development
      DB_DRIVER: Postgre
      DB_HOSTNAME: db
      DB_USERNAME: eproc_user
      DB_PASSWORD: eproc_password
      DB_DATABASE: eproc_db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eproc_ci4_network

  node-dev:
    image: node:18-alpine
    container_name: eproc_node_dev
    working_dir: /app
    volumes:
      - .:/app
      - ci4_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - eproc_ci4_network

  db:
    image: postgres:12
    container_name: eproc_db_ci4
    environment:
      POSTGRES_USER: eproc_user
      POSTGRES_PASSWORD: eproc_password
      POSTGRES_DB: eproc_db
    ports:
      - "5433:5432"
    volumes:
      - ci4_db_data:/var/lib/postgresql/data
    networks:
      - eproc_ci4_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eproc_user -d eproc_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ci4_db_data:
  ci4_vendor:
  ci4_node_modules:

networks:
  eproc_ci4_network:
    driver: bridge
